version: 2
updates:
  # Rust dependencies. Group minor/patch bumps into one PR to cut review noise.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Keep the pinned GitHub Actions (checkout, rust-cache, docker/*, audit) fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
