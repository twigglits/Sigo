# cargo-deny supply-chain gate. https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`; CI runs it on every push/PR.

[advisories]
# Fail the build on a RUSTSEC security advisory; flag yanked crates.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses actually present in the dependency tree. A new dependency
# under a license not listed here fails the check (review before adding).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Surface duplicate versions (e.g. several rustls/TLS layers) in the log without
# failing the build; ban wildcard version requirements except for path deps.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io is permitted; an unknown registry or git source fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
