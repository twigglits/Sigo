[workspace]
resolver = "2"
members = ["crates/sigo-core", "crates/sigo-cli"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Sino-Anglo translation layer for Claude — EN→ZH→Claude→EN with token-minimization and objective coding benchmarks"
homepage = "https://github.com/twigglits/Sigo"
repository = "https://github.com/twigglits/Sigo"
keywords = ["claude", "translation", "ollama", "benchmark", "token-optimization"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
async-trait = "0.1"

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
rustyline = "14"
eventsource-stream = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
insta = { version = "1", features = ["json"] }

# Thin LTO + a single codegen unit shrink and speed up the shipped binary (incl. the
# musl release artifacts and Docker image); symbols are stripped. opt-level stays at the
# default 3 — the tokenizer/SSE paths want it. panic="abort" is deliberately NOT set: a
# panic in the long `bench run` parent should unwind so partial JSONL is flushed.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keep stack traces useful while recompiling faster than full debuginfo.
[profile.dev]
debug = "line-tables-only"
